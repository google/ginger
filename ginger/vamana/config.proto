edition = "2024";

package ginger;

import "ginger/robust_prune_config.proto";

// Config for building a Vamana index.
message VamanaConfig {
  // The maximum degree of the graph. Must be positive.
  int32 max_degree = 1;

  // Specifies the parameters for a single pass of the build algorithm.
  message Pass {
    // The maximum beam width of the beam search. Must be positive.
    int32 max_beam_width = 1;

    // RobustPrune parameters for this pass. `alpha` must be at least 1.0.
    // `nonpositive_distances` is set by `GingerSearcherBuilder` from the
    // distance metric. `reverse_rng_backfill` is not supported.
    RobustPruneConfig prune_config = 3;

    reserved 2;
  }

  // The list of passes to run. Must contain at least one pass. Fields that a
  // pass leaves unset are copied from the previous pass.
  repeated Pass passes = 2;

  // The seed to use for the random number generator.
  int32 seed = 3;

  // If enabled log the progress to stdout. Otherwise, log to INFO. stdout
  // offers a nicer progress tracker.
  bool log_progress_to_stdout = 4;
}
