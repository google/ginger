edition = "2024";

package ginger.array_io;

option features.default_symbol_visibility = STRICT;

// Table of contents of a single-file index written by array_io.cc.
message TableOfContents {
  message Range {
    uint64 offset = 1;
    uint64 size = 2;
  }
  // Byte range of each entry in the file, by entry name.
  map<string, Range> entries = 1;

  // Version of the file layout. Readers reject files with a newer version than
  // they support. Files written before versioning was added have version 0.
  uint32 format_version = 2;
}
